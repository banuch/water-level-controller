; Wintek Smart Water Tank Controller — ESP32-C3 firmware
;
; Toolchain constraints (verified):
;   platform espressif32 6.9.0  -> framework-arduinoespressif32 3.20017 (Arduino-ESP32 2.0.17, ESP-IDF 4.4.7)
;                                -> toolchain-riscv32-esp 8.4.0+2021r2-patch5 (GCC 8.4, C++17)
;   ArduinoJson 7.2.1, WebSockets (Links2004) 2.6.1. MQTT uses the ESP-IDF esp-mqtt
;   client that ships inside the Arduino core (no extra library).
; Arduino-ESP32 3.x is NOT used: it is not published for the official
; PlatformIO espressif32 platform and its esp-mqtt/WebServer APIs differ.

[platformio]
default_envs = esp32c3_devkit

[esp32c3_base]
platform = espressif32 @ 6.9.0
framework = arduino
board = esp32-c3-devkitm-1
board_build.partitions = partitions_wintek_4MB.csv
board_build.flash_mode = dio            ; works on every ESP32-C3-MINI-1 / DevKitM-1 flash
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    bblanchon/ArduinoJson @ 7.2.1
    links2004/WebSockets @ 2.6.1
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-missing-field-initializers
    -DARDUINO_USB_MODE=1                ; native USB-Serial-JTAG (GPIO18/19)
    -DARDUINO_USB_CDC_ON_BOOT=1         ; Serial == USB CDC console
    -DWEBSOCKETS_SERVER_CLIENT_MAX=4
    -Iinclude
    -Isrc

; Bench development on an ESP32-C3-DevKitM-1 without contactor feedback,
; overload input or I2C front panel (enable them in the config when wired).
[env:esp32c3_devkit]
extends = esp32c3_base
build_flags =
    ${esp32c3_base.build_flags}
    -DWINTEK_DEVBOARD_DEFAULTS
    -DCORE_DEBUG_LEVEL=2
    -DWINTEK_HW_REV=\"DEVKIT\"

; Custom PCB, hardware revision A (all I/O populated).
[env:esp32c3_pcb_reva]
extends = esp32c3_base
build_flags =
    ${esp32c3_base.build_flags}
    -DWINTEK_HW_REV=\"A\"
    -DCORE_DEBUG_LEVEL=1

; Host-side unit tests for the hardware-independent logic:
;   pio test -e native
; (equivalent without PlatformIO: tools/run_host_tests.sh)
[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_deps = bblanchon/ArduinoJson @ 7.2.1
build_flags = -std=gnu++17 -Wall -Wextra -Isrc -Iinclude -DUNITY_SUPPORT_64
build_src_filter =
    -<*>
    +<core/Types.cpp>
    +<sensors/ProbeSensor.cpp>
    +<sensors/LevelEstimator.cpp>
    +<motor/SafetyManager.cpp>
    +<motor/MotorStateMachine.cpp>
    +<storage/Config.cpp>
    +<storage/ConfigJson.cpp>
    +<services/ScheduleManager.cpp>
    +<services/CommandProcessor.cpp>
    +<services/OtaManifest.cpp>
    +<services/AlertManager.cpp>
